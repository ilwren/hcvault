name: build-demos

# Two modes:
#   push / pull request  - automated tests only: the Linux job builds
#                          hcvault-core and runs the managed test suite once
#                          per target framework (net8.0 + net10.0) plus the
#                          Python wrapper tests. Nothing is published.
#   manual run           - full release build, published as a GitHub Release:
#     (Actions tab ->      Actions -> build-demos -> Run workflow -> enter
#      "Run workflow")     the version tag, e.g. v1.4.0 (must match the
#                          version in the project files).
#
# Release contents:
#   - HCVault.Explorer     WPF (Windows), framework-dependent zip
#   - HCVault.MauiDemo     .NET MAUI, Android — one APK per ABI
#   - HCVault.AndroidDemo  plain .NET Android (API 21+), universal APK
#   - HCVault.Native       NuGet package with the prebuilt native libraries
#                          (Windows x64/x86/ARM64, Android 4 ABIs; linux-x64
#                           built by the native-linux job)
#   - HCVault.Core         managed wrapper NuGet package
#   - hcvault              Python wheels (pure-ctypes wrapper; linux-x64,
#                          Windows x64/x86/ARM64 and macOS arm64 (best
#                          effort) native libraries bundled; not on PyPI)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.4.0) - must match the version in the project files'
        required: true
        type: string

# a newer push/PR cancels the superseded run (saves queue + build time);
# manual release runs are never cancelled by anything
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  wpf:
    name: WPF demo (HCVault.Explorer)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # the demo loads hcvault-core.dll at runtime - build it so the zip
      # contains everything needed to run (the loader finds it next to the exe)
      - name: Build native library (win-x64)
        run: .\build.ps1 -Arch x64 -SkipManaged -NoDownload

      - name: Publish WPF demo (framework-dependent)
        run: |
          dotnet publish app/HCVault.Explorer -c Release -o publish\wpf
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item native\runtimes\win-x64\native\hcvault-core.dll publish\wpf\

      - name: Package zip
        run: Compress-Archive -Path publish\wpf\* -DestinationPath HCVault.Explorer-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wpf-demo
          path: HCVault.Explorer-win-x64.zip

  native-linux:
    name: native + managed + Python tests (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # builds hcvault-core (linux-x64), then runs the managed test suite
      # once per target framework (net8.0 + net10.0)
      - name: Build + test
        run: bash ./build.sh

      # the Python wrapper runs against the freshly built linux-x64 library
      # (same repository-layout discovery as the C# suite); once on the
      # supported floor (3.8) and once on the runner's default Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Python wrapper tests (3.8, supported floor)
        run: python3 python/tests/run_tests.py

      - name: Python wrapper tests (runner default)
        run: /usr/bin/python3 python/tests/run_tests.py

      # the .so is only needed when a release is being assembled
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: native-linux-x64
          path: native/runtimes/linux-x64/native/

  android:
    name: Android demos (MAUI per-ABI APKs + API 21 demo)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet package cache: the MAUI/Android closure is large; this makes
      # restore near-instant on warm runs (keyed on the project files).
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'managed/**/*.csproj') }}

      # The GitHub Windows runners already ship the Android SDK
      # (C:\Android\android-sdk); export its location for the NDK setup and
      # the builds. (android-actions/setup-android can no longer be used: it
      # insists on installing the legacy 'tools' package, which Google removed
      # from the SDK repository, so every run fails.)
      - name: Android SDK environment
        shell: pwsh
        run: |
          $sdk = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, 'C:\Android\android-sdk') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'platform-tools')) } |
              Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found (looked at ANDROID_HOME, ANDROID_SDK_ROOT, C:\Android\android-sdk)' }
          Add-Content $env:GITHUB_ENV "ANDROID_HOME=$sdk"
          Add-Content $env:GITHUB_ENV "ANDROID_SDK_ROOT=$sdk"
          Write-Host "Android SDK: $sdk"
          Write-Host ('contents: ' + ((Get-ChildItem $sdk -Name) -join ', '))

      # NDK r27c -> ANDROID_NDK_HOME (used by the CMake presets)
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build native library (4 ABIs)
        run: .\build.ps1 -Android -SkipManaged -NoDownload
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # the 4 Android libraries, shared with the package job below (it does
      # not have an NDK and does not rebuild them)
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: native/runtimes/android-*/native/libhcvault-core.so

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Publish MAUI demo (one APK per ABI)
        run: |
          foreach ($rid in 'android-arm64','android-x64','android-arm','android-x86') {
            dotnet publish app/HCVault.MauiDemo -c Release -r $rid
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Build plain Android demo (universal APK, Android 5.0+)
        run: dotnet build app/HCVault.AndroidDemo -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: maui-apks
          path: app/HCVault.MauiDemo/bin/Release/net10.0-android/*/publish/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: androiddemo-apk
          path: app/HCVault.AndroidDemo/bin/Release/net10.0-android/*-Signed.apk

  python-wheel-linux:
    name: Python wheel (linux-x64)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    needs: [native-linux]     # supplies the linux-x64 .so bundled into the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # linux-x64 .so built by the native-linux job; the wheel bundles it
      # under hcvault/_binaries/linux-x64/ (setup.py)
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/runtimes/linux-x64/native/

      - name: Build wheel
        run: python3 -m pip wheel python/ -w wheelhouse/ --no-deps

      # prove the wheel is self-contained: install into a clean venv and run
      # the smoke test from outside the repository
      - name: Smoke test (clean venv)
        run: |
          python3 -m venv /tmp/hcvenv
          /tmp/hcvenv/bin/pip install wheelhouse/*.whl
          cd /tmp
          /tmp/hcvenv/bin/python "$GITHUB_WORKSPACE/python/tests/smoke_wheel.py"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-linux
          path: wheelhouse/*.whl

  python-wheel-windows:
    name: Python wheels (Windows x64 / x86 / ARM64)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build native libraries (x64 + x86 + ARM64)
        run: .\build.ps1 -Arch All -SkipManaged -NoDownload

      # the runner is x64, so the plain build bundles win-x64; the other two
      # architectures are selected with HCVAULT_WHEEL_RID (the bundled DLL is
      # never loaded during the build, so cross-arch wheels are safe)
      - name: Build wheels (win_amd64 + win32 + win_arm64)
        run: |
          python -m pip wheel python/ -w wheelhouse/ --no-deps
          $env:HCVAULT_WHEEL_RID = 'win-x86'
          python -m pip wheel python/ -w wheelhouse/ --no-deps
          $env:HCVAULT_WHEEL_RID = 'win-arm64'
          python -m pip wheel python/ -w wheelhouse/ --no-deps
          Get-ChildItem wheelhouse/ | Select-Object -ExpandProperty Name

      # the x64 wheel installs on this runner - prove it end to end
      - name: Smoke test (x64 wheel, clean venv)
        run: |
          python -m venv $env:TEMP\hcvenv
          & $env:TEMP\hcvenv\Scripts\python.exe -m pip install (Get-Item wheelhouse\*win_amd64.whl).FullName
          Set-Location $env:TEMP
          & $env:TEMP\hcvenv\Scripts\python.exe "$env:GITHUB_WORKSPACE\python\tests\smoke_wheel.py"

      # pip refuses to install the win32 / win_arm64 wheels on this runner
      # (tag mismatch), so verify each bundled DLL's PE machine code against
      # the tag promised by the wheel filename instead
      - name: Verify cross-arch wheels (PE machine vs tag)
        run: python python/tests/check_wheel_arch.py wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-windows
          path: wheelhouse/*.whl

  python-wheel-macos:
    name: Python wheel (macos-arm64, best effort)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    runs-on: macos-latest
    timeout-minutes: 30
    # the macOS native library builds on the POSIX base but is otherwise
    # untested - a failure here must not block the release (it ships without
    # a macOS wheel that time; the smoke test below gates what does ship)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # VC_RID must be passed explicitly: the CMake RID inference has no
      # Darwin branch and would otherwise file the library under linux-arm64
      - name: Build native library (osx-arm64)
        run: |
          cmake -S native -B build-local -D CMAKE_BUILD_TYPE=Release -D VC_RID=osx-arm64
          cmake --build build-local --parallel 3

      - name: Build wheel
        run: python3 -m pip wheel python/ -w wheelhouse/ --no-deps

      - name: Smoke test (clean venv)
        run: |
          python3 -m venv /tmp/hcvenv
          /tmp/hcvenv/bin/pip install wheelhouse/*.whl
          cd /tmp
          /tmp/hcvenv/bin/python "$GITHUB_WORKSPACE/python/tests/smoke_wheel.py"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-macos
          path: wheelhouse/*.whl

  package:
    name: NuGet package (HCVault.Native)
    if: github.event_name == 'workflow_dispatch'   # release build: manual runs only
    needs: [native-linux, android]     # android supplies the 4 Android .so below
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet package cache: the MAUI/Android closure is large; this makes
      # restore near-instant on warm runs (keyed on the project files).
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'managed/**/*.csproj') }}

      # linux-x64 .so built by the native-linux job
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/runtimes/linux-x64/native/

      # the 4 Android .so built by the android job (shared, not rebuilt here)
      - uses: actions/download-artifact@v4
        with:
          name: native-android
          path: native/runtimes/

      - name: Build native libraries (Windows x64/x86/ARM64)
        run: .\build.ps1 -Arch All -SkipManaged -NoDownload

      - name: Pack (both NuGet packages)
        run: |
          dotnet pack native/HCVault.Native.pack.csproj -c Release
          dotnet pack managed/HCVault.Core -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            native/bin/Release/*.nupkg
            managed/HCVault.Core/bin/Release/*.nupkg

  release:
    name: GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [wpf, native-linux, android, package, python-wheel-linux, python-wheel-windows, python-wheel-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts    # one subfolder per artifact name

      # download-artifact keeps each artifact in its own subfolder; nested
      # paths are preserved below the least common ancestor of the upload,
      # so everything is located with find instead of hardcoded paths.
      - name: Collect release assets
        run: |
          set -e
          mkdir release
          cp artifacts/wpf-demo/HCVault.Explorer-win-x64.zip release/

          # MAUI APKs: one per ABI, renamed after their RID folders
          find artifacts/maui-apks -name '*.apk' | while read -r apk; do
            abi=$(printf '%s' "$apk" | grep -oE 'android-(arm64|arm|x64|x86)' | head -n1)
            cp "$apk" "release/HCVault.MauiDemo-$abi.apk"
          done

          # plain .NET Android demo: universal APK (all 4 ABIs, API 21+)
          find artifacts/androiddemo-apk -name '*-Signed.apk' \
              -exec cp {} release/HCVault.AndroidDemo-universal.apk \;

          # NuGet packages (HCVault.Native + HCVault.Core)
          find artifacts/nuget-package -name '*.nupkg' -exec cp {} release/ \;

          # Python wheels: linux-x64 + Windows x64/x86/ARM64 are required;
          # macOS arm64 is best effort (its native library is untested and
          # the wheel job is allowed to fail without blocking the release)
          cp artifacts/python-wheel-linux/hcvault-*.whl release/ \
              || { echo "missing release asset: linux python wheel"; exit 1; }
          cp artifacts/python-wheel-windows/hcvault-*.whl release/ \
              || { echo "missing release asset: windows python wheels"; exit 1; }
          cp artifacts/python-wheel-macos/hcvault-*.whl release/ 2>/dev/null \
              || echo "note: no macOS python wheel this run (best-effort job)"

          # fail loudly instead of shipping a partial release
          for f in HCVault.Explorer-win-x64.zip \
                   HCVault.MauiDemo-android-arm64.apk \
                   HCVault.MauiDemo-android-arm.apk \
                   HCVault.MauiDemo-android-x64.apk \
                   HCVault.MauiDemo-android-x86.apk \
                   HCVault.AndroidDemo-universal.apk; do
            [ -f "release/$f" ] || { echo "missing release asset: $f"; exit 1; }
          done
          nupkgs=$(find release -maxdepth 1 -name '*.nupkg' | wc -l)
          [ "$nupkgs" -ge 2 ] || { echo "expected 2 NuGet packages, found $nupkgs"; exit 1; }

          echo '--- release assets ---'
          ls -la release/

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -e
          tag="$RELEASE_TAG"

          # sanity: well-formed tag, e.g. v1.4.0 or v1.4.0-beta.1
          printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$' \
              || { echo "invalid tag '$tag' (expected e.g. v1.4.0)"; exit 1; }

          # the tag must match the version the packages were built from -
          # a v1.5.0 release containing 1.4.0 packages would be confusing
          core_pkg=$(find artifacts/nuget-package -name 'HCVault.Core.*.nupkg' | head -n1)
          native_pkg=$(find artifacts/nuget-package -name 'HCVault.Native.*.nupkg' | head -n1)
          core_ver=$(basename "$core_pkg" .nupkg); core_ver=${core_ver#HCVault.Core.}
          native_ver=$(basename "$native_pkg" .nupkg); native_ver=${native_ver#HCVault.Native.}
          [ "$core_ver" = "$native_ver" ] \
              || { echo "package version mismatch: HCVault.Core $core_ver vs HCVault.Native $native_ver"; exit 1; }
          [ "$tag" = "v$core_ver" ] \
              || { echo "tag $tag does not match the built package version v$core_ver - bump the versions in the project files, or dispatch with v$core_ver"; exit 1; }

          # every Python wheel must carry the same version as the packages
          # (linux + 3 Windows wheels are hard-required; macOS is optional)
          whl_count=0
          for whl in release/hcvault-*.whl; do
              [ -f "$whl" ] || continue
              whl_count=$((whl_count + 1))
              whl_ver=$(basename "$whl" | sed -E 's/^hcvault-([^-]+)-.*/\1/')
              [ "$whl_ver" = "$core_ver" ] \
                  || { echo "python wheel version $whl_ver does not match the package version $core_ver ($whl)"; exit 1; }
          done
          [ "$whl_count" -ge 4 ] \
              || { echo "expected at least 4 python wheels (linux + 3 windows), found $whl_count"; exit 1; }

          if gh release view "$tag"; then
            echo "release $tag already exists - replacing its assets"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
